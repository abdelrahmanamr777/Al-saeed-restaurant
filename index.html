<title>Al-Sa'eed Restaurant</title>

<style>
/* Layout: bright ivory-white page, royal navy type from the restaurant's own sign, saffron gold for warmth.
   Hero plate sits inside a gold sunburst; menu in tabs; majlis planner on a gold-tint band; phone number always one tap away. */
:root{
  --bg:#FFFFFF;
  --tint:#F4F7FF;
  --sand:#FFF5D6;
  --ink:#14205F;
  --ink-2:#4B5588;
  --line:#E1E7F6;
  --gold:#F0AE12;
  --gold-soft:#FFE7A3;
  --gold-deep:#8F6200;
  --ruby:#C4202E;
  --fd:'Bodoni Moda','Didot',Georgia,serif;
  --fb:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html[lang="ar"]{
  --fd:'Reem Kufi','Segoe UI',Tahoma,sans-serif;
  --fb:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#fff}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{letter-spacing:0}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{scroll-margin-top:84px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:.95rem}
.lead{font-size:1.1rem;color:var(--ink-2);max-width:56ch}
.num{unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:50px;padding:.7rem 1.5rem;border-radius:999px;font-weight:700;font-size:1rem;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s,background .15s}
.btn svg{width:18px;height:18px;flex:none}
.btn-gold{background:var(--gold);color:var(--ink);box-shadow:0 8px 20px rgba(240,174,18,.35)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(240,174,18,.45)}
.btn-navy{background:var(--ink);color:#fff}
.btn-navy:hover{background:#1d2d7e}
.btn-ghost{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--ink);color:#fff}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.mark{width:48px;height:48px;flex:none}
.bn{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bn b{font-family:var(--fd);font-size:1.15rem;white-space:nowrap}
.bn small{font-size:.74rem;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
html[lang="ar"] .bn small{letter-spacing:0;text-transform:none;font-size:.85rem}
.nav{display:flex;gap:28px}
.nav a{text-decoration:none;font-weight:500;font-size:.95rem;color:var(--ink-2);padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink);border-bottom-color:var(--gold)}
.actions{display:flex;align-items:center;gap:10px}
.lang{min-height:44px;padding:.4rem 1rem;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);font:700 .95rem var(--fb);cursor:pointer}
.lang:hover{border-color:var(--ink)}
.top .btn{min-height:44px;padding:.4rem 1.2rem}

/* hero */
.hero{position:relative;overflow:hidden;background:
  radial-gradient(60% 70% at 85% 30%,var(--sand),transparent 70%),
  linear-gradient(180deg,#fff,var(--tint))}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;padding-block:56px 64px}
.hero-copy{display:flex;flex-direction:column;gap:22px;min-width:0}
.hero h1{font-size:clamp(2.7rem,6.2vw,5rem);line-height:1.02}
html[lang="ar"] .hero h1{line-height:1.3;font-size:clamp(2.4rem,5.6vw,4.2rem)}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips li{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.88rem;font-weight:500}
.chips li::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.hero-art{position:relative;width:100%;max-width:560px;margin-inline:auto;aspect-ratio:1/.95}
.sun{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--gold) 0 4deg,transparent 4deg 9deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 69%);mask:radial-gradient(circle,#000 30%,transparent 69%);opacity:.55;animation:spin 120s linear infinite}
.halo{position:absolute;inset:12% 10%;border-radius:50%;background:radial-gradient(circle,#fff 40%,var(--gold-soft) 100%);border:2px solid var(--gold)}
.hero-art img{position:absolute;filter:drop-shadow(0 22px 22px rgba(20,32,95,.25))}
.hero-art .big{width:82%;left:9%;top:28%}
.hero-art .s1{width:38%;left:0;top:6%}
.hero-art .s2{width:40%;right:0;bottom:0}
.tag{position:absolute;top:2%;right:4%;display:flex;flex-direction:column;align-items:center;padding:14px 26px;background:var(--gold);color:var(--ink);clip-path:polygon(5% 0,100% 7%,95% 100%,0 93%);line-height:1.1;text-align:center}
.tag small{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
html[lang="ar"] .tag small{letter-spacing:0;font-size:.9rem}
.tag b{font-family:var(--fd);font-size:2rem}
.tag span{font-size:.8rem;font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
.band{height:14px;background:linear-gradient(135deg,var(--gold) 25%,transparent 25%) -7px 0,linear-gradient(225deg,var(--gold) 25%,transparent 25%) -7px 0,linear-gradient(315deg,var(--gold) 25%,transparent 25%),linear-gradient(45deg,var(--gold) 25%,transparent 25%);background-size:14px 14px;background-color:#fff}

/* why */
.why{padding-block:64px}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.why-grid h3{font-size:1.5rem;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.why-grid h3::before{content:"";flex:none;width:12px;height:12px;background:var(--gold);transform:rotate(45deg)}
.why-grid p{color:var(--ink-2)}

/* section heads */
.head{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
.head h2{font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.1}
html[lang="ar"] .head h2{line-height:1.3}

/* menu */
.menu{background:var(--tint);padding-block:72px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:28px;scrollbar-width:thin}
.tabs button{flex:none;min-height:46px;padding:.5rem 1.3rem;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);font:700 .95rem var(--fb);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button:hover{border-color:var(--ink)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}
.dish{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 14px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.plate{width:100%;aspect-ratio:2/1;display:grid;place-items:center;background:radial-gradient(closest-side,var(--sand),transparent);margin-bottom:6px}
.plate img{width:88%;filter:drop-shadow(0 12px 12px rgba(20,32,95,.22))}
.dish h3{font-size:1.25rem}
.who{color:var(--ink-2);font-size:.92rem}
.price{display:inline-flex;align-items:baseline;gap:6px;margin-top:8px;padding:6px 20px;background:var(--gold-soft);color:var(--ruby);font-weight:700;clip-path:polygon(5% 0,100% 8%,95% 100%,0 92%)}
.price b{font-family:var(--fd);font-size:1.55rem;line-height:1.1}
.price small{font-size:.8rem;font-weight:700}
.sub{margin-top:36px;display:flex;flex-direction:column;gap:14px}
.sub h4{margin:0;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);font-weight:700}
html[lang="ar"] .sub h4{letter-spacing:0;font-size:1rem}
.sizes{display:grid;gap:0 36px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.sizes li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dotted #aab3d6}
.sizes b,.rows b{color:var(--ruby);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{color:var(--ink-2);font-size:.95rem;max-width:70ch}
.rows-wrap{display:grid;gap:36px;grid-template-columns:1fr}
.rows h3{font-size:1.4rem;margin-bottom:10px}
.rows li{display:flex;align-items:baseline;gap:10px;padding:8px 0}
.rows li i{flex:1;border-bottom:2px dotted #aab3d6;transform:translateY(-4px);min-width:16px}
.new{display:inline-block;margin-inline-start:8px;padding:2px 10px;border-radius:999px;background:var(--ruby);color:#fff;font:700 .72rem var(--fb);letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}
html[lang="ar"] .new{letter-spacing:0;font-size:.82rem}

/* majlis */
.majlis{background:var(--sand);padding-block:80px}
.maj-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:stretch}
.card{background:#fff;border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:18px;min-width:0;box-shadow:0 18px 40px rgba(143,98,0,.12)}
.card h3{font-size:1.6rem}
.guests{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.guests label{font-weight:700}
.guests output{font-family:var(--fd);font-size:2.6rem;line-height:1;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ink);height:32px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.res>div{border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.res small{font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);font-size:.74rem}
html[lang="ar"] .res small{letter-spacing:0;font-size:.9rem}
.res strong{font-family:var(--fd);font-size:1.9rem;line-height:1.1;color:var(--ruby)}
.res span{color:var(--ink-2);font-size:.92rem}
.steps{display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:baseline}
.steps li::before{content:"";flex:none;width:9px;height:9px;background:var(--gold);transform:rotate(45deg) translateY(-1px)}
.bignum{font-family:var(--fd);font-size:clamp(1.9rem,4vw,2.5rem);line-height:1.1;text-decoration:none;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.facts li{padding:14px 18px;border-top:3px solid var(--gold);font-weight:700;background:rgba(255,255,255,.55)}

/* reviews */
.reviews{padding-block:80px}
.q-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.q{display:flex;flex-direction:column;gap:18px;padding:28px;border-radius:24px;background:var(--tint);border:1px solid var(--line);justify-content:space-between;min-width:0}
.q p{font-family:var(--fd);font-size:1.3rem;line-height:1.45}
html[lang="ar"] .q p{font-family:var(--fb);font-size:1.15rem;line-height:1.8}
.q footer{font-size:.85rem;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.q footer::before{content:"";width:22px;height:2px;background:var(--gold)}

/* visit */
.visit{background:var(--tint);padding-block:80px}
.visit-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.visit .card{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px}

footer.site{padding-block:36px 40px;border-top:1px solid var(--line)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot .brand b{font-size:1.1rem}
.fine{font-size:.85rem;color:var(--ink-2);max-width:60ch}

.callbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:600px){.grid.c3,.grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.rows-wrap{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){
  .nav{display:none}
  .hero-grid{grid-template-columns:1fr;padding-block:36px 48px}
  .why-grid,.q-grid{grid-template-columns:1fr;gap:28px}
  .maj-grid,.visit-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
}
@media (max-width:760px){
  body{padding-bottom:84px}
  .top .btn{display:none}
  .bn small{display:none}
  .res{grid-template-columns:1fr}
  .card{padding:22px}
  .callbar{display:flex;position:fixed;inset:auto 0 0;z-index:25;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .callbar .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){.sun{animation:none}html{scroll-behavior:auto}.btn,.toast{transition:none}}
</style>

  ];

  var lang = 'en';
  try { if (localStorage.getItem('alsaeed-lang') === 'ar') lang = 'ar'; } catch (e) {}
  var ix = function () { return lang === 'ar' ? 1 : 0; };

  var L = function (a) { return a[ix()]; };
  var fmt = function (n) { return n.toLocaleString('en-US'); };
  var people = function (n) {
    if (lang === 'ar') return n === 1 ? 'نفر واحد' : n === 2 ? 'نفران' : n <= 10 ? n + ' أنفار' : n + ' نفراً';
    return n + (n === 1 ? ' person' : ' people');
  };
  var serves = function (n) { return lang === 'ar' ? 'يكفي ' + people(n) : 'Serves ' + n; };

  var $ = function (id) { return document.getElementById(id); };

  function dish(d, who) {
    return '<article class="dish"><div class="plate"><img src="' + IMG[d.img] + '" alt="' + L(d.name) + '" loading="lazy"></div>' +

  function sizes(list) {
    return '<ul class="sizes">' + list.map(function (r) {

  }
  function renderMenu() {
    var allMandi = [];

    var cards = MATHBI.filter(function (d) { return d.img; });

    allMathbi.push([L(HEAD.name), HEAD.price]);
    $('tab-mathbi').innerHTML =
      '<p class="note" style="margin-bottom:22px">' + t('mathbi_note') + '</p>' +
      '<div class="grid c4">' + cards.map(function (d) { return dish(d, serves(d.n)); }).join('') + '</div>' +

    }).join('') + '</div>';

    $('tab-sweets').innerHTML =
      '<p class="note" style="margin-bottom:22px"><span class="new">' + t('isnew') + '</span> ' + t('sweets_note') + '</p>' +
      '<div class="grid c3">' + SWEETS.map(function (d) {
        return '<article class="dish"><div class="plate"><img src="' + IMG[d.img] + '" alt="' + L(d.name) + '" loading="lazy"></div><h3>' + L(d.name) + '</h3></article>';
      }).join('') + '</div>';
  }
  function renderReviews() {
    $('qgrid').innerHTML = REVIEWS.map(function (r) {
      return '<figure class="q" style="margin:0"><p>' + (lang === 'ar' ? '«' : '“') + L(r) + (lang === 'ar' ? '»' : '”') + '</p><footer>' + t('rv_tag') + '</footer></figure>';
    }).join('');
  }
  function plan() {
    var g = +$('guests').value;
    $('gout').textContent = g;
    $('r-mandi').textContent = fmt(g * 95) + ' ' + t('sr');
    $('r-mandi-s').textContent = people(g);
    var m = MATHBI.filter(function (x) { return x.n >= g; })[0];
    $('r-mathbi').textContent = fmt(m.price) + ' ' + t('sr');
    $('r-mathbi-s').textContent = L(m.name) + ' · ' + people(m.n);
  }
  function apply() {
    var h = document.documentElement;
    h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = lang === 'ar' ? D.brand[1] : D.brand[0];
    Array.prototype.forEach.call(document.querySelectorAll('[data-i]'), function (el) { el.textContent = t(el.getAttribute('data-i')); });
    Array.prototype.forEach.call(document.querySelectorAll('img[data-img]'), function (el) { el.src = IMG[el.getAttribute('data-img')]; });
    var b = $('lang'); b.textContent = t('lang_btn'); b.setAttribute('aria-label', t('lang_label'));
    renderMenu(); renderReviews(); plan();
  }

  $('lang').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('alsaeed-lang', lang); } catch (e) {}
    apply();
  });
  $('guests').addEventListener('input', plan);
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    Array.prototype.forEach.call($('tabs').children, function (x) {
      var on = x === b; x.setAttribute('aria-selected', on ? 'true' : 'false');
      $('tab-' + x.getAttribute('data-tab')).hidden = !on;
    });
  });
  var tt;
  function toast(msg) {
    var el = $('toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, 1800);
  }
  $('copy').addEventListener('click', function () {
    var done = function () { toast(t('copied')); };
    var fallback = function () {
      var r = document.createRange(); r.selectNodeContents($('phone'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand('copy'); done(); } catch (e) {}
    };
    try { navigator.clipboard.writeText(PHONE).then(done, fallback); } catch (e) { fallback(); }
  });
  apply();
})();
